name: Market-First LIVE Smoke v0 Offline Contracts

on:
  push:
    paths:
      - "benchmarks/market_first_live_smoke_v0/**"
      - "tests/test_market_first_live_smoke_v0.py"
      - ".github/workflows/market-first-live-smoke-v0.yml"
  pull_request:
    paths:
      - "benchmarks/market_first_live_smoke_v0/**"
      - "tests/test_market_first_live_smoke_v0.py"
      - ".github/workflows/market-first-live-smoke-v0.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: market-first-live-smoke-v0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile smoke runner and tests
        run: |
          python -m py_compile benchmarks/market_first_live_smoke_v0/run.py
          python -m py_compile tests/test_market_first_live_smoke_v0.py

      - name: Run focused offline contract suite
        run: python -m unittest tests.test_market_first_live_smoke_v0 -v
