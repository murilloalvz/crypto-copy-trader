name: Market collection coverage store v0

on:
  push:
    branches:
      - spike/commodity-signal-plane-v0
    paths:
      - 'src/market_collection_coverage_store.py'
      - 'benchmarks/market_regime_detector_v0/stored_coverage_adapter.py'
      - 'tests/test_market_collection_coverage_store.py'
      - '.github/workflows/market-collection-coverage-store-v0.yml'
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile coverage modules
        run: |
          python -m py_compile src/market_collection_coverage_store.py
          python -m py_compile benchmarks/market_regime_detector_v0/stored_coverage_adapter.py

      - name: Run focused coverage tests
        run: python -m unittest tests.test_market_collection_coverage_store -v

      - name: Run full unit suite
        run: python -m unittest discover -s tests -q
