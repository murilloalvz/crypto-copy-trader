name: Market protocol facts v0

on:
  push:
    branches:
      - spike/commodity-signal-plane-v0
    paths:
      - "src/market_protocol_facts.py"
      - "tests/test_market_protocol_facts.py"
      - "benchmarks/market_protocol_facts_v0/**"
      - "docs/market-first-protocol-facts-decision-2026-09-09.md"
      - ".github/workflows/market-protocol-facts-v0.yml"
  workflow_dispatch:

jobs:
  protocol-facts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile sources
        run: python -m compileall -q src benchmarks tests

      - name: Protocol facts targeted tests
        run: python -m unittest tests.test_market_protocol_facts -v

      - name: Future-append differential
        run: python -m benchmarks.market_protocol_facts_v0.differential --seed 20260909 --snapshots 5000

      - name: Full unit suite
        run: python -m unittest discover -s tests -q
