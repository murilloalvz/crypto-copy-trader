name: Market signal kernel production

on:
  push:
    branches:
      - spike/commodity-signal-plane-v0
    paths:
      - "src/market_signal_kernel.py"
      - "src/market_opportunity_radar.py"
      - "src/carbon_market_trade_adapter.py"
      - "src/carbon_matched_unit_adapter.py"
      - "tests/test_market_signal_kernel.py"
      - "tests/test_carbon_market_trade_adapter.py"
      - ".github/workflows/market-signal-kernel-production.yml"
  workflow_dispatch:

jobs:
  production-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile sources
        run: python -m compileall -q src benchmarks tests

      - name: Kernel and Carbon trade adapter differential tests
        run: |
          python -m unittest \
            tests.test_market_signal_kernel \
            tests.test_market_opportunity_radar \
            tests.test_carbon_market_trade_adapter \
            tests.test_commodity_signal_plane_v0 \
            tests.test_integrated_market_signal_plane_v1 \
            -v

      - name: Full unit suite
        run: python -m unittest discover -s tests -q
