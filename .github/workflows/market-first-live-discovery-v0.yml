name: Market-First LIVE Discovery v0 Offline Contracts

on:
  push:
    branches:
      - spike/commodity-signal-plane-v0
    paths:
      - 'benchmarks/market_first_live_discovery_v0/**'
      - 'tests/test_market_first_live_discovery_v0.py'
      - '.github/workflows/market-first-live-discovery-v0.yml'
  pull_request:
    paths:
      - 'benchmarks/market_first_live_discovery_v0/**'
      - 'tests/test_market_first_live_discovery_v0.py'
      - '.github/workflows/market-first-live-discovery-v0.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: market-first-live-discovery-v0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile live discovery coordinator
        run: |
          python -m py_compile benchmarks/market_first_live_discovery_v0/contracts.py
          python -m py_compile benchmarks/market_first_live_discovery_v0/rotating_trace.py
          python -m py_compile benchmarks/market_first_live_discovery_v0/pipeline.py
          python -m py_compile benchmarks/market_first_live_discovery_v0/run.py
          python -m py_compile tests/test_market_first_live_discovery_v0.py

      - name: Run live discovery offline contracts
        run: python -m unittest tests.test_market_first_live_discovery_v0 -v

      - name: Re-run frozen Research Plane boundary contracts
        run: |
          python -m unittest tests.test_market_activity_discovery_research_processor_v0 -v
          python -m unittest tests.test_market_activity_discovery_admission_v0 -v
          python -m unittest tests.test_market_activity_discovery_audit_v0 -v
