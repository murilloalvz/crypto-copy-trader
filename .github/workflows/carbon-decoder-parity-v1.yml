name: Carbon decoder parity v1

on:
  push:
    branches:
      - spike/commodity-signal-plane-v0
    paths:
      - 'benchmarks/carbon_decoder_parity_v1/**'
      - 'tests/test_carbon_decoder_parity_v1.py'
      - '.github/workflows/carbon-decoder-parity-v1.yml'

jobs:
  parity-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run parity harness tests
        run: python -m unittest discover -s tests -p 'test_carbon_decoder_parity_v1.py' -v

      - name: Set up Rust 1.96.1
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.96.1

      - name: Check Carbon parity runner
        run: cargo check --manifest-path benchmarks/carbon_decoder_parity_v1/rust_runner/Cargo.toml
