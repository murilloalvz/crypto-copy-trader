name: Robinhood Sequencer Transport V0

on:
  push:
    branches:
      - feat/robinhood-sequencer-shadow-v0
    paths:
      - 'src/robinhood_nitro_feed_v0.py'
      - 'src/robinhood_nitro_ws_v0.py'
      - 'src/robinhood_nitro_bootstrap_v0.py'
      - 'tests/test_robinhood_nitro_feed_v0.py'
      - 'tests/test_robinhood_nitro_ws_v0.py'
      - 'tests/test_robinhood_nitro_bootstrap_v0.py'
      - '.github/workflows/robinhood-sequencer-transport-v0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transport-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: |
          python -m py_compile src/robinhood_nitro_feed_v0.py
          python -m py_compile src/robinhood_nitro_ws_v0.py
          python -m py_compile src/robinhood_nitro_bootstrap_v0.py
          python -m py_compile tests/test_robinhood_nitro_feed_v0.py
          python -m py_compile tests/test_robinhood_nitro_ws_v0.py
          python -m py_compile tests/test_robinhood_nitro_bootstrap_v0.py
      - name: Test
        run: |
          python -m unittest tests.test_robinhood_nitro_feed_v0 -v
          python -m unittest tests.test_robinhood_nitro_ws_v0 -v
          python -m unittest tests.test_robinhood_nitro_bootstrap_v0 -v
