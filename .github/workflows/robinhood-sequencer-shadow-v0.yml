name: Robinhood Sequencer Shadow V0

on:
  push:
    branches:
      - feat/robinhood-sequencer-shadow-v0
      - research/robinhood-launch-burst-v0
    paths:
      - 'src/robinhood_nitro_feed_v0.py'
      - 'benchmarks/robinhood_sequencer_shadow_v0/**'
      - 'tests/test_robinhood_nitro_feed_v0.py'
      - 'tests/test_robinhood_sequencer_capture_v0.py'
      - 'tests/test_robinhood_sequencer_bootstrap_classifier_v0.py'
      - 'tests/test_robinhood_sequencer_coordinated_v0.py'
      - 'tests/test_robinhood_sequencer_reconcile_v0.py'
      - 'docs/robinhood_sequencer_shadow_v0.md'
      - '.github/workflows/robinhood-sequencer-shadow-v0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: |
          python -m py_compile src/robinhood_nitro_feed_v0.py
          python -m py_compile benchmarks/robinhood_sequencer_shadow_v0/capture.py
          python -m py_compile benchmarks/robinhood_sequencer_shadow_v0/classify_bootstrap.py
          python -m py_compile benchmarks/robinhood_sequencer_shadow_v0/coordinated.py
          python -m py_compile benchmarks/robinhood_sequencer_shadow_v0/reconcile.py
          python -m py_compile tests/test_robinhood_nitro_feed_v0.py
          python -m py_compile tests/test_robinhood_sequencer_capture_v0.py
          python -m py_compile tests/test_robinhood_sequencer_bootstrap_classifier_v0.py
          python -m py_compile tests/test_robinhood_sequencer_coordinated_v0.py
          python -m py_compile tests/test_robinhood_sequencer_reconcile_v0.py
      - name: Test
        run: |
          python -m unittest tests.test_robinhood_nitro_feed_v0 -v
          python -m unittest tests.test_robinhood_sequencer_capture_v0 -v
          python -m unittest tests.test_robinhood_sequencer_bootstrap_classifier_v0 -v
          python -m unittest tests.test_robinhood_sequencer_coordinated_v0 -v
          python -m unittest tests.test_robinhood_sequencer_reconcile_v0 -v
