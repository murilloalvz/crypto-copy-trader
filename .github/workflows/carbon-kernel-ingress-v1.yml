name: Carbon kernel ingress v1 (frozen)

on:
  workflow_dispatch:

jobs:
  ingress:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run integrated ingress contract tests
        run: python -m unittest tests.test_carbon_kernel_ingress_v1 -v

      - name: Run existing adapter and kernel focused tests
        run: |
          python -m unittest tests.test_carbon_matched_unit_adapter -v
          python -m unittest tests.test_carbon_market_trade_adapter -v
          python -m unittest tests.test_market_signal_kernel -v

      - name: Set up Rust 1.96.1
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.96.1
          cache: false

      - name: Build bounded microbatch Carbon decoder
        run: |
          cargo build --release --locked \
            --manifest-path benchmarks/carbon_decoder_parity_v1/rust_runner/Cargo.toml \
            --bin stream_decode_batches

      - name: Run frozen integrated 5k events-per-second gate
        run: |
          python -m benchmarks.carbon_kernel_ingress_v1.benchmark \
            --binary benchmarks/carbon_decoder_parity_v1/rust_runner/target/release/stream_decode_batches \
            --events 5000 \
            --target-rate 5000 \
            --batch-size 16 \
            --max-batch-wait-ms 1.0 \
            --out artifacts/carbon_kernel_ingress_v1/report.json

      - name: Upload integrated ingress report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carbon-kernel-ingress-v1-frozen-report
          path: artifacts/carbon_kernel_ingress_v1/report.json
          if-no-files-found: ignore
