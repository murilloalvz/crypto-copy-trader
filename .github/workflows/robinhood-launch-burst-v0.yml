name: Robinhood Launch Burst V0

on:
  push:
    branches:
      - research/robinhood-launch-burst-v0
    paths:
      - 'src/robinhood_pons_launch_burst_v0.py'
      - 'src/pons_v2_curve_quote_v0.py'
      - 'benchmarks/robinhood_launch_burst_v0/**'
      - 'tests/test_robinhood_pons_launch_burst_v0.py'
      - 'tests/test_robinhood_launch_burst_integrity_v0.py'
      - 'tests/test_robinhood_live_rpc_v0.py'
      - 'tests/test_robinhood_fee_dynamics_v0.py'
      - 'tests/test_robinhood_acquisition_parity_v0.py'
      - 'tests/test_robinhood_protocol_capabilities_v0.py'
      - 'tests/test_robinhood_rpc_batch_v0.py'
      - 'tests/test_pons_v2_curve_quote_v0.py'
      - 'tests/test_pons_v2_curve_quote_state_v0.py'
      - 'tests/test_pons_direct_quote_transport_bench_v0.py'
      - 'docs/robinhood_launch_burst_v0.md'
      - 'docs/robinhood_rpc_batch_v0.md'
      - 'docs/pons_direct_quote_v0.md'
      - 'docs/pons_direct_quote_transport_bench_v0.md'
      - '.github/workflows/robinhood-launch-burst-v0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feature-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: |
          python -m py_compile src/robinhood_pons_launch_burst_v0.py
          python -m py_compile src/pons_v2_curve_quote_v0.py
          python -m py_compile benchmarks/robinhood_launch_burst_v0/offline.py
          python -m py_compile benchmarks/robinhood_launch_burst_v0/live.py
          python -m py_compile benchmarks/robinhood_launch_burst_v0/preflight.py
          python -m py_compile benchmarks/robinhood_launch_burst_v0/summarize.py
          python -m py_compile benchmarks/robinhood_launch_burst_v0/factory_discovery.py
          python -m py_compile benchmarks/robinhood_launch_burst_v0/audit.py
          python -m py_compile benchmarks/robinhood_launch_burst_v0/fee_dynamics.py
          python -m py_compile benchmarks/robinhood_launch_burst_v0/acquisition_parity.py
          python -m py_compile benchmarks/robinhood_launch_burst_v0/protocol_capabilities.py
          python -m py_compile benchmarks/robinhood_launch_burst_v0/rpc_batch_contract_v0.py
          python -m py_compile benchmarks/robinhood_launch_burst_v0/direct_quote_state.py
          python -m py_compile benchmarks/robinhood_launch_burst_v0/direct_quote.py
          python -m py_compile benchmarks/robinhood_launch_burst_v0/direct_quote_transport_bench.py
          python -m py_compile tests/test_robinhood_pons_launch_burst_v0.py
          python -m py_compile tests/test_robinhood_launch_burst_integrity_v0.py
          python -m py_compile tests/test_robinhood_live_rpc_v0.py
          python -m py_compile tests/test_robinhood_fee_dynamics_v0.py
          python -m py_compile tests/test_robinhood_acquisition_parity_v0.py
          python -m py_compile tests/test_robinhood_protocol_capabilities_v0.py
          python -m py_compile tests/test_robinhood_rpc_batch_v0.py
          python -m py_compile tests/test_pons_v2_curve_quote_v0.py
          python -m py_compile tests/test_pons_v2_curve_quote_state_v0.py
          python -m py_compile tests/test_pons_direct_quote_transport_bench_v0.py
      - name: Test
        run: |
          python -m unittest tests.test_robinhood_pons_launch_burst_v0 -v
          python -m unittest tests.test_robinhood_launch_burst_integrity_v0 -v
          python -m unittest tests.test_robinhood_live_rpc_v0 -v
          python -m unittest tests.test_robinhood_fee_dynamics_v0 -v
          python -m unittest tests.test_robinhood_acquisition_parity_v0 -v
          python -m unittest tests.test_robinhood_protocol_capabilities_v0 -v
          python -m unittest tests.test_robinhood_rpc_batch_v0 -v
          python -m unittest tests.test_pons_v2_curve_quote_v0 -v
          python -m unittest tests.test_pons_v2_curve_quote_state_v0 -v
          python -m unittest tests.test_pons_direct_quote_transport_bench_v0 -v
