name: Helius standard WSS shadow v0

on:
  push:
    branches:
      - spike/commodity-signal-plane-v0
    paths:
      - 'benchmarks/helius_standard_wss_shadow_v0/**'
      - 'tests/test_helius_standard_wss_shadow_v0.py'
      - 'tests/test_helius_standard_wss_shadow_reduce_v0.py'
      - 'tests/test_helius_standard_wss_shadow_adapt_v0.py'
      - 'tests/test_helius_pumpswap_pool_bootstrap_probe_v0.py'
      - '.github/workflows/helius-standard-wss-shadow-v0.yml'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install WSS dependency
        run: |
          python -m pip install --upgrade pip
          pip install -r benchmarks/helius_standard_wss_shadow_v0/requirements.txt

      - name: Compile research modules
        run: |
          python -m py_compile benchmarks/helius_standard_wss_shadow_v0/collect.py
          python -m py_compile benchmarks/helius_standard_wss_shadow_v0/reduce.py
          python -m py_compile benchmarks/helius_standard_wss_shadow_v0/adapt.py
          python -m py_compile benchmarks/helius_standard_wss_shadow_v0/bootstrap_pools.py

      - name: Run WSS shadow contract tests
        run: python -m unittest tests.test_helius_standard_wss_shadow_v0 -v

      - name: Run WSS shadow reducer tests
        run: python -m unittest tests.test_helius_standard_wss_shadow_reduce_v0 -v

      - name: Run WSS shadow adapter audit tests
        run: python -m unittest tests.test_helius_standard_wss_shadow_adapt_v0 -v

      - name: Run PumpSwap pool bootstrap probe tests
        run: python -m unittest tests.test_helius_pumpswap_pool_bootstrap_probe_v0 -v
