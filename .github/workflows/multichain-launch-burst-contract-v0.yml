name: Multichain Launch Burst Contract V0

on:
  push:
    branches:
      - feat/multichain-launch-burst-contract-v0
    paths:
      - 'src/multichain_launch_burst_contract_v0.py'
      - 'tests/test_multichain_launch_burst_contract_v0.py'
      - 'docs/multichain_launch_burst_contract_v0.md'
      - '.github/workflows/multichain-launch-burst-contract-v0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: |
          python -m py_compile src/multichain_launch_burst_contract_v0.py
          python -m py_compile tests/test_multichain_launch_burst_contract_v0.py
      - name: Test
        run: python -m unittest tests.test_multichain_launch_burst_contract_v0 -v
