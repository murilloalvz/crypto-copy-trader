name: Carbon stream bridge v0

on:
  push:
    branches:
      - spike/commodity-signal-plane-v0
    paths:
      - 'benchmarks/carbon_stream_bridge_v0/**'
      - 'benchmarks/carbon_decoder_parity_v1/rust_runner/**'
      - 'tests/test_carbon_stream_bridge_v0.py'
      - '.github/workflows/carbon-stream-bridge-v0.yml'
  workflow_dispatch:

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run bridge contract tests
        run: python -m unittest tests.test_carbon_stream_bridge_v0 -v

      - name: Set up Rust 1.96.1
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.96.1

      - name: Build persistent Carbon stream decoder
        run: |
          cargo build --release --locked \
            --manifest-path benchmarks/carbon_decoder_parity_v1/rust_runner/Cargo.toml \
            --bin stream_decode_events

      - name: Run frozen transport diagnostic matrix
        run: |
          python -m benchmarks.carbon_stream_bridge_v0.diagnostic_matrix \
            --binary benchmarks/carbon_decoder_parity_v1/rust_runner/target/release/stream_decode_events \
            --out artifacts/carbon_stream_bridge_v0/diagnostic-matrix.json

      - name: Run frozen 5k events-per-second bridge gate
        run: |
          python -m benchmarks.carbon_stream_bridge_v0.benchmark \
            --binary benchmarks/carbon_decoder_parity_v1/rust_runner/target/release/stream_decode_events \
            --events 5000 \
            --target-rate 5000 \
            --out artifacts/carbon_stream_bridge_v0/report.json

      - name: Upload bridge reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carbon-stream-bridge-v0-report
          path: |
            artifacts/carbon_stream_bridge_v0/report.json
            artifacts/carbon_stream_bridge_v0/diagnostic-matrix.json
          if-no-files-found: ignore
