name: PumpSwap Identity Bootstrap v0

on:
  push:
    branches:
      - spike/commodity-signal-plane-v0
    paths:
      - 'benchmarks/pumpswap_identity_bootstrap_v0/**'
      - 'tests/test_pumpswap_identity_bootstrap_v0.py'
      - '.github/workflows/pumpswap-identity-bootstrap-v0.yml'
  pull_request:
    paths:
      - 'benchmarks/pumpswap_identity_bootstrap_v0/**'
      - 'tests/test_pumpswap_identity_bootstrap_v0.py'
      - '.github/workflows/pumpswap-identity-bootstrap-v0.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pumpswap-identity-bootstrap-v0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python bootstrap and tests
        run: |
          python -m py_compile benchmarks/pumpswap_identity_bootstrap_v0/bootstrap.py
          python -m py_compile tests/test_pumpswap_identity_bootstrap_v0.py

      - name: Run causal bootstrap contract tests
        run: python -m unittest tests.test_pumpswap_identity_bootstrap_v0 -v

      - name: Set up Rust 1.96.1
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.96.1

      - name: Check PumpSwap account decoder
        run: cargo check --manifest-path benchmarks/pumpswap_identity_bootstrap_v0/rust_runner/Cargo.toml --bins
