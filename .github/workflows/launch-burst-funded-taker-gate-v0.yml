name: Launch Burst Funded Taker Gate V0

on:
  push:
    branches:
      - feat/launch-burst-funded-taker-gate-v0
      - spike/launch-burst-v0
    paths:
      - 'benchmarks/launch_burst_prospective_route_live_v4/funded_taker_fixture_v0.frozen.json'
      - 'benchmarks/launch_burst_prospective_route_live_v4/funded_taker_preflight.py'
      - 'tests/test_launch_burst_funded_taker_preflight_v0.py'
      - 'docs/launch-burst-v4-funded-taker-gate-v0.md'
      - '.github/workflows/launch-burst-funded-taker-gate-v0.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launch-burst-funded-taker-gate-v0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile funded taker gate
        run: |
          python -m py_compile benchmarks/launch_burst_prospective_route_live_v4/funded_taker_preflight.py
          python -m py_compile tests/test_launch_burst_funded_taker_preflight_v0.py

      - name: Funded taker fail-closed contracts
        run: python -m unittest tests.test_launch_burst_funded_taker_preflight_v0 -v
