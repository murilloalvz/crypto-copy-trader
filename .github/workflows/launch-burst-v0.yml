name: Launch Burst V0

on:
  push:
    branches:
      - spike/launch-burst-v0
    paths:
      - 'src/launch_burst_v0.py'
      - 'benchmarks/launch_burst_replay_v0/**'
      - 'tests/test_launch_burst_v0.py'
      - 'tests/test_launch_burst_replay_v0.py'
      - 'src/market_observation_store.py'
      - 'src/market_opportunity_radar.py'
      - 'tests/test_market_observation_store.py'
      - 'tests/test_market_opportunity_radar.py'
      - '.github/workflows/launch-burst-v0.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launch-burst-v0-${{ github.ref }}-${{ matrix.python-version }}
  cancel-in-progress: true

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Launch Burst V0
        run: |
          python -m py_compile src/launch_burst_v0.py
          python -m py_compile benchmarks/launch_burst_replay_v0/run.py
          python -m py_compile tests/test_launch_burst_v0.py
          python -m py_compile tests/test_launch_burst_replay_v0.py

      - name: Launch Burst causal contracts
        run: |
          python -m unittest tests.test_launch_burst_v0 -v
          python -m unittest tests.test_launch_burst_replay_v0 -v

      - name: Retained market observation contracts
        run: |
          python -m unittest tests.test_market_observation_store -v
          python -m unittest tests.test_market_opportunity_radar -v
