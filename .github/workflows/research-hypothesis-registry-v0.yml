name: Research Hypothesis Registry V0

on:
  push:
    branches:
      - research/hypothesis-registry-v0
    paths:
      - 'src/research_hypothesis_registry_v0.py'
      - 'tests/test_research_hypothesis_registry_v0.py'
      - '.github/workflows/research-hypothesis-registry-v0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: |
          python -m py_compile src/research_hypothesis_registry_v0.py
          python -m py_compile tests/test_research_hypothesis_registry_v0.py
      - name: Test
        run: python -m unittest tests.test_research_hypothesis_registry_v0 -v
