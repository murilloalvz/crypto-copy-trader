name: Carbon kernel ingress v0

on:
  push:
    branches:
      - spike/commodity-signal-plane-v0
    paths:
      - 'benchmarks/carbon_kernel_ingress_v0/**'
      - 'benchmarks/carbon_decoder_parity_v1/rust_runner/**'
      - 'src/carbon_market_trade_adapter.py'
      - 'src/carbon_matched_unit_adapter.py'
      - 'src/market_signal_kernel.py'
      - 'src/market_opportunity_radar.py'
      - 'tests/test_carbon_kernel_ingress_v0.py'
      - '.github/workflows/carbon-kernel-ingress-v0.yml'
  workflow_dispatch:

jobs:
  ingress:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run ingress contract tests
        run: python -m unittest tests.test_carbon_kernel_ingress_v0 -v

      - name: Set up Rust 1.96.1
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.96.1

      - name: Build persistent Carbon stream decoder
        run: |
          cargo build --release --locked \
            --manifest-path benchmarks/carbon_decoder_parity_v1/rust_runner/Cargo.toml \
            --bin stream_decode_events

      - name: Run deterministic Carbon to kernel replay
        run: |
          python -m benchmarks.carbon_kernel_ingress_v0.replay \
            --binary benchmarks/carbon_decoder_parity_v1/rust_runner/target/release/stream_decode_events \
            --events 500 \
            --out artifacts/carbon_kernel_ingress_v0/report.json

      - name: Upload ingress report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carbon-kernel-ingress-v0-report
          path: artifacts/carbon_kernel_ingress_v0/report.json
          if-no-files-found: ignore
