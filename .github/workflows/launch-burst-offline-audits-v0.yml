name: Launch Burst Offline Audits V0

on:
  push:
    branches:
      - spike/launch-burst-v0
    paths:
      - 'benchmarks/launch_burst_run_inventory_v0/**'
      - 'benchmarks/launch_burst_coverage_audit_v0/**'
      - 'benchmarks/launch_burst_matched_unit_coverage_v0/**'
      - 'benchmarks/launch_burst_readiness_v0/**'
      - 'benchmarks/launch_burst_shadow_v0/**'
      - 'tests/test_launch_burst_run_inventory_v0.py'
      - 'tests/test_launch_burst_coverage_audit_v0.py'
      - 'tests/test_launch_burst_matched_unit_coverage_v0.py'
      - 'tests/test_launch_burst_readiness_v0.py'
      - 'tests/test_launch_burst_shadow_v0.py'
      - '.github/workflows/launch-burst-offline-audits-v0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-audits:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: |
          python -m py_compile benchmarks/launch_burst_run_inventory_v0/run.py
          python -m py_compile benchmarks/launch_burst_coverage_audit_v0/run.py
          python -m py_compile benchmarks/launch_burst_matched_unit_coverage_v0/run.py
          python -m py_compile benchmarks/launch_burst_readiness_v0/run.py
          python -m py_compile benchmarks/launch_burst_shadow_v0/run.py
          python -m py_compile tests/test_launch_burst_run_inventory_v0.py
          python -m py_compile tests/test_launch_burst_coverage_audit_v0.py
          python -m py_compile tests/test_launch_burst_matched_unit_coverage_v0.py
          python -m py_compile tests/test_launch_burst_readiness_v0.py
          python -m py_compile tests/test_launch_burst_shadow_v0.py
      - name: Run offline audit contracts
        run: |
          python -m unittest tests.test_launch_burst_run_inventory_v0 -v
          python -m unittest tests.test_launch_burst_coverage_audit_v0 -v
          python -m unittest tests.test_launch_burst_matched_unit_coverage_v0 -v
          python -m unittest tests.test_launch_burst_readiness_v0 -v
          python -m unittest tests.test_launch_burst_shadow_v0 -v
